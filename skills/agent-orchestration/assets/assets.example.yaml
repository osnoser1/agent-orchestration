# Copy to ~/.config/agent-orchestration/assets.yaml (or set $AGENT_ORCHESTRATION_ASSETS).
# Keep personal quota data outside git repositories and in this YAML subset for orch.py.
version: 1
updated: 2026-11-20T09:00:00+00:00
preferences:
  pay_per_use: never                              # never | ask (ask once before spending pay-per-use APIs)
  low_threshold: 85                               # used_percent >= low_threshold -> status: low
  exhausted_threshold: 98                         # used_percent >= exhausted_threshold -> status: exhausted
  ui_fallback: proceed                            # proceed | defer | ask (when an offered UI/UX or repo Models preference is exhausted)
  new_conversations: ask                          # ask | allow (authorization to open new top-level conversations)
  design_checkpoints: ask                         # ask | delegate (pause for user approval on taste/design checkpoints)
  # evidence: "red-green tests; browser screenshots on UI changes"  # optional user evidence priorities / deprioritized checks
  tier_floors: {T1: 20, T2: 40, T3: 50, T4: 57}   # optional override of references/selection.md floors
providers:
  # id = provider id your harness uses for delegation.
  # policy: ending | spend-first | normal | preserve | avoid
  # status: ok | low | exhausted (expired exhausted_until / resets_at clears to ok automatically).
  # probe: optional automatic quota source for `orch.py probe`.
  - id: claude
    plan: Claude subscription
    policy: preserve
    status: ok
    probe: {kind: claude, config_dir: ~/.claude}
    # When a child hits a limit or `orch.py probe` reaches exhausted_threshold (default 98%), the helper writes:
    #   status: exhausted
    #   used_percent: 100
    #   window: 7d
    #   resets_at: 2026-11-23T08:00:00+00:00
    #   exhausted_until: 2026-11-23T08:00:00+00:00
    #   status_note: "You've hit your weekly limit · resets Nov 23, 3am (America/New_York)"
    resets: weekly
  - id: claude-extra
    plan: Claude subscription (secondary account)
    policy: normal
    status: ok
    probe: {kind: claude, config_dir: ~/.claude_extra}
    resets: weekly
  - id: antigravity
    plan: Antigravity subscription
    policy: spend-first       # use-it-or-lose-it quota
    status: ok                # best status across groups (ok if any group is usable)
    probe: {kind: antigravity}
    groups:
      - name: "Gemini Models"
        models: [gemini-4-neon, gemini-4-hydrogen, gemini-pro-orchestrator-neon, gemini-3-8-flash]
        status: ok
        used_percent: 50
        window: 7d
        resets_at: 2026-12-01T00:00:00+00:00
      - name: "Claude and GPT models"
        models: [claude-opus-5-5, claude-sonnet-5-5, gpt-oss-120b]
        status: exhausted
        used_percent: 100
        window: 7d
        resets_at: 2026-12-02T00:00:00+00:00
      - name: "Gemini 4 Argon"
        models: [gemini-4-argon, gemini-pro-orchestrator-g1-pro]
        status: ok
        used_percent: 0
        window: 7d
        resets_at: 2026-12-02T00:00:00+00:00
    resets: 2026-12-01
  - id: codex
    plan: ChatGPT subscription
    policy: ending            # plan ending: spend it first
    status: ok
    probe: {kind: codex, codex_home: ~/.codex}
    renews: 2026-11-30
  - id: openai-api
    plan: OpenAI API (billed per token)
    policy: avoid
    pay_per_use: true
    status: ok
