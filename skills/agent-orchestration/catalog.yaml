# Shared model catalog. Stable facts only: no personal quota or account data.
# Update via PR. Subset of YAML: block maps, "- " lists of maps, one-line {..} and [..].
# Scores = Artificial Analysis Intelligence Index (higher = smarter) per reasoning effort.
# cost: cheap | normal | expensive | emergency   (emergency: only if all else exhausted, or user asks)
# rating: rated | unrated   (unrated -> research ONCE per references/research-unrated.md, then record here)
# Tier floors (see references/selection.md): T1 25, T2 40, T3 50, T4 57.
version: 1
updated: 2026-11-20
emergency_efforts: [max, ultra]   # efforts never chosen automatically, for any model
index_versions:
  aa-v5: {name: "Artificial Analysis Intelligence Index v5", url: "https://artificialanalysis.ai/", retrieved: 2026-11-20}
  aa-v4.3: {name: "Artificial Analysis Intelligence Index v4.3", url: "https://artificialanalysis.ai/", retrieved: 2026-11-20}
